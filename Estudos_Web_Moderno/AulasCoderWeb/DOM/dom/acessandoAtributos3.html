<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Acessando Atributos #03</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>

  <body class="conteudo exercicio">
    <div>
      <ul id="compras" destino="escritório" data-urgencia="5">
        <li>Café</li>
        <li>Água</li>
        <li>Copo Descartável</li>
      </ul>
    </div>
    <script>
      const lista = document.querySelector("#compras");
      console.log(lista.attributes);
      lista.attributes[0]; // atributo id
      lista.attributes[1]; // atributo destino
      lista.attributes[2]; // atributo data-urgencia
      lista.attributes.id;
      lista.attributes.destino;
      lista.attributes["data-urgencia"];
      lista.attributes.id.value; // "compras"
    </script>
  </body>
</html>
